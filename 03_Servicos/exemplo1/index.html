<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Usuário - Aula 1</title>
    <style>
        body{ 
            font-family: Arial, sans-serif; 
            margin: 40px; 
        }
        
        .form-group{
            margin-bottom: 15px;
        }
        
        label{
            display: block; 
            margin-bottom: 5px;
        }
        
        input{ 
            width: 300px; padding: 8px; 
        }
        
        button{ 
            padding: 10px 15px; 
            background-color: #28a745; 
            color: white; 
            border: none; 
            cursor: pointer; 
        }
    </style>
</head>
<body>

<h2>Cadastro de Usuário (Visão do Site)</h2>
<form action="cadastrarSite.php" method="POST">
    <div class="form-group">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" required>
    </div>

    <div class="form-group">
        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" required>
    </div>

    <div class="form-group">
        <label for="senha">Senha:</label>
        <input type="password" id="senha" name="senha" required>
    </div>

    <button type="submit">Cadastrar</button>
</form>

</body>
</html>
